# Include inside the HTTPS application server block. The current UTCOJ site
# serves HTTP on site:8000. Keep the existing TLS and trusted-proxy configuration.
# Verify the uWSGI process has post-buffering disabled before enabling imports.
location ^~ /users/import_users/ {
    client_max_body_size 6m;  # 5 MiB CSV plus multipart framing; Django checks the file itself.
    client_body_buffer_size 6m;
    client_body_in_file_only off;
    client_body_timeout 60s;

    proxy_pass http://site:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Cookie, CSRF, Idempotency-Key and Authorization pass through unchanged.
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_max_temp_file_size 0;
    proxy_next_upstream off;
    proxy_intercept_errors off;
    proxy_read_timeout 60s;

    # These routes contain account metadata; neither body nor URI is needed in logs.
    access_log off;
    error_page 413 = @user_import_too_large;
}

location @user_import_too_large {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 413 '{"error":{"code":"file_too_large","message":"The CSV exceeds the upload size limit."}}';
}
