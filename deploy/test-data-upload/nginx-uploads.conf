# Include inside EVERY application HTTPS server{} serving the upload UI.
# In the existing location / keep uwsgi_pass site:8001 and add:
#     uwsgi_param HTTP_X_FORWARDED_PROTO $scheme;
# Django trusts only protocol headers overwritten by this proxy.
location ^~ /internal/test-data-uploads/ {
    return 404;
}

location = /_test_upload_auth {
    internal;
    # The subrequest inherits the PATCH length even though no body is forwarded.
    client_max_body_size 20m;
    proxy_pass http://site:8000/internal/test-data-uploads/authorize/;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $http_host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
    proxy_set_header X-Test-Upload-Token $http_x_test_upload_token;
    include /etc/nginx/snippets/upload-secret.conf;
    proxy_set_header X-Original-Method $upload_request_method;
    proxy_set_header X-Original-URI $upload_request_uri;
    proxy_set_header X-Original-Content-Length $upload_content_length;
    proxy_set_header Upload-Length $http_upload_length;
    proxy_set_header Upload-Metadata $http_upload_metadata;
    proxy_set_header Upload-Defer-Length $http_upload_defer_length;
    proxy_set_header Upload-Concat $http_upload_concat;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache off;
}

location ^~ /uploads/ {
    # Capture before auth_request changes the subrequest's method to GET.
    set $upload_request_method $request_method;
    set $upload_request_uri $request_uri;
    set $upload_content_length $http_content_length;
    auth_request /_test_upload_auth;
    client_max_body_size 20m;
    client_body_timeout 120s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Preserve the external port too: tusd builds Location from these headers.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization "";
    include /etc/nginx/snippets/upload-secret.conf;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_pass http://tusd:1080;
    add_header Cache-Control "no-store" always;
}
