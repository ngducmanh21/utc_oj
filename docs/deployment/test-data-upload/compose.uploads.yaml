# Apply after the existing compose.yaml and compose.override.yaml. This adds
# mounts by target; it does not replace the existing email, DB or judge settings.
services:
  site:
    environment:
      TEST_UPLOAD_INTERNAL_SECRET: ${TEST_UPLOAD_INTERNAL_SECRET:?set a shared random secret}
    volumes:
      - ../data/test-uploads:/test-uploads

  celery:
    environment:
      TEST_UPLOAD_INTERNAL_SECRET: ${TEST_UPLOAD_INTERNAL_SECRET:?set a shared random secret}
    volumes:
      - ../data/test-uploads:/test-uploads

  tusd:
    image: tusproject/tusd:v2.8.0
    restart: unless-stopped
    user: "${UPLOAD_UID:?match the application UID}:${UPLOAD_GID:?match the application GID}"
    command:
      - -host=0.0.0.0
      - -port=1080
      - -base-path=/uploads/
      - -upload-dir=/test-uploads
      - -max-size=1073741824
      - -behind-proxy
      - -disable-download
      - -disable-termination
      - -disable-cors
      - -hooks-http=http://site:8000/internal/test-data-uploads/hooks/
      - -hooks-http-forward-headers=X-Test-Upload-Token,X-Upload-Secret,X-Forwarded-Proto
      - -hooks-enabled-events=pre-create,post-create,post-receive,post-finish
      - -progress-hooks-interval=30s
      - -hooks-http-retry=5
      - -network-timeout=120s
      - -shutdown-timeout=30s
      - -verbose=false
    stop_grace_period: 40s
    volumes:
      - ../data/test-uploads:/test-uploads
    depends_on:
      - site
    # Deliberately no published port. Only Nginx can accept public uploads.

  nginx:
    volumes:
      - ./test-data-upload/nginx-uploads.conf:/etc/nginx/snippets/test-data-uploads.conf:ro
      - ./test-data-upload/upload-secret.conf:/etc/nginx/snippets/upload-secret.conf:ro
    depends_on:
      - tusd
